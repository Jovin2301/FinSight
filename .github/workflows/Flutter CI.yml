name: Flutter CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finsight
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Create .env for CI
        run: echo "BASE_URL=https://placeholder" > .env
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run unit & widget tests
        run: flutter test --coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: finsight/coverage/lcov.info
          fail_ci_if_error: false
  build:
    name: Build APK
    needs: test # only runs if the test job passes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finsight
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Create .env for CI
        run: echo "API_URL=https://placeholder" > .env
      - name: Build APK (release)
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: finsight/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
  build_ios_simulator:
    name: Build iOS (Simulator)
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: finsight
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Create .env for CI
        run: echo "API_URL=https://placeholder" > .env
      - name: Build for iOS Simulator (no signing needed)
        run: flutter build ios --simulator --no-codesign
